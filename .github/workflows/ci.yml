name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per branch: a newer push cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: dns-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dns-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  console:
    name: dns-console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dns-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Only so the build can evaluate server modules; the real values come from the runtime environment
          DNS_API_URL: http://127.0.0.1:8081
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef

  tools:
    name: pdns-import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdns-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pdns-import/package-lock.json
      - run: npm ci
      - run: npm test

  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [server, console, tools]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dns-server
            context: dns-server
          - name: dns-console
            context: dns-console
    env:
      # Pull requests build the image to prove it works, but only main and version tags are published
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patchvia-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
